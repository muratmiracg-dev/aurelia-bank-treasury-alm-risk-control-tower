name: analytical-quality

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=aurelia_alm --cov-report=term-missing --cov-fail-under=90
      # The committed files must match the committed MANIFEST.sha256 ...
      - run: python scripts/verify_artifacts.py
      # ... and regenerating the demo must reproduce the committed values. The manifest
      # alone cannot show this: the pipeline rewrites outputs and manifest together.
      - run: |
          mkdir -p "$RUNNER_TEMP/committed/artifacts"
          cp -r data "$RUNNER_TEMP/committed/data"
          cp -r artifacts/results "$RUNNER_TEMP/committed/artifacts/results"
          cp artifacts/aurelia_alm_demo.sqlite "$RUNNER_TEMP/committed/artifacts/"
      - run: python scripts/run_demo.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib-aurelia
      - run: python scripts/compare_outputs.py "$RUNNER_TEMP/committed"
      - run: python scripts/verify_artifacts.py

